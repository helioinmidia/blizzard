map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name view.blizzard.net;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivo de configuração é montado como volume: nunca cachear.
    location /config/ {
        add_header Cache-Control "no-store";
    }

    # Assets com hash no nome podem ser cacheados por muito tempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API de configuração (server/config-api.py): lê e grava public/config/blizzard.config.json.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        client_max_body_size 4m;
    }

    # Proxy para o go2rtc (API, WebSocket de sinalização e MSE).
    location /go2rtc/ {
        proxy_pass http://127.0.0.1:1984/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        # O go2rtc recusa WebSocket quando Origin e Host divergem; sem Origin ele aceita.
        proxy_set_header Origin "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
