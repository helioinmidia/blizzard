# Blizzard · Central de Monitoramento
# Sobe o go2rtc (proxy de vídeo) e o servidor web da central.
# Funciona em x86_64 e ARM64 (Raspberry Pi 4 com Raspberry Pi OS 64 bits).
services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: blizzard-go2rtc
    restart: unless-stopped
    # WebRTC precisa de UDP direto até o navegador; a forma mais simples na rede local é host networking.
    network_mode: host
    volumes:
      - ./go2rtc:/config
    environment:
      - TZ=America/Sao_Paulo

  # API que persiste a configuração no servidor (a tela salva aqui, nunca no navegador).
  config-api:
    image: python:3.12-alpine
    container_name: blizzard-config-api
    restart: unless-stopped
    network_mode: host
    # Mesmo usuário do dono do repositório, para o arquivo continuar editável fora do container.
    user: "${BLIZZARD_UID:-1000}:${BLIZZARD_GID:-1000}"
    command: ["python", "/app/config-api.py"]
    volumes:
      - ./server:/app:ro
      - ./public/config:/data
    environment:
      - CONFIG_PATH=/data/blizzard.config.json
      - PORT=8787
      - BIND=127.0.0.1
      - TZ=America/Sao_Paulo

  # Ponte do Home Assistant: guarda o token (arquivo .env) e entrega ao navegador, somente para leitura,
  # os estados das entidades citadas nas fontes "ha" do blizzard.config.json. Escuta só em 127.0.0.1:8099.
  ha-bridge:
    build: ./ha-bridge
    image: blizzard-ha-bridge:local
    container_name: blizzard-ha-bridge
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./public/config:/config:ro
    environment:
      - TZ=America/Sao_Paulo

  web:
    build: .
    image: blizzard-web:local
    container_name: blizzard-web
    restart: unless-stopped
    network_mode: host
    volumes:
      # Edite public/config/blizzard.config.json e recarregue a página; não precisa rebuildar.
      - ./public/config:/usr/share/nginx/html/config:ro
    depends_on:
      - go2rtc
      - config-api
      - ha-bridge
    environment:
      - TZ=America/Sao_Paulo
