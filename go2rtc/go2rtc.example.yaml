# Exemplo de configuração do go2rtc (https://github.com/AlexxIT/go2rtc).
# O arquivo usado de verdade é go2rtc/go2rtc.yaml (fora do git, porque guarda senhas): o pi/install.sh e os
# scripts pi/*-streams.py criam esse arquivo a partir deste exemplo quando ele não existe.
# Os nomes dos streams aqui devem bater com "stream"/"hdStream" em public/config/blizzard.config.json.
#
# Regra de ouro para o Raspberry Pi 4: na grade use SEMPRE o sub-stream (baixa resolução) de cada câmera.
# O Pi decodifica vídeo por software no Chromium; 4 a 6 streams de ~640x360 são confortáveis,
# 1080p em várias células não. O stream principal (hd) só é usado ao ampliar uma célula.

api:
  listen: ":1984"

webrtc:
  listen: ":8555"
  # Descomente e informe o IP do Pi na rede se o navegador não conseguir negociar WebRTC.
  # candidates:
  #   - 192.168.1.50:8555

rtsp:
  listen: ":8554"

streams:
  # ---------------------------------------------------------------------------
  # UniFi Protect (casa)
  # Automático: ./pi/protect-streams.py --host IP_DO_CONSOLE --api-key CHAVE --apply
  # (gera um bloco entre "# >>> unifi-protect" e "# <<< unifi-protect" logo abaixo de "streams:").
  # Manual: no app/console Protect: Câmera > Configurações > Avançado > habilite os RTSP streams
  # (Low para a grade, High para ampliar) e copie as URLs "rtsps://IP:7441/TOKEN?enableSrtp".
  # No go2rtc use o esquema rtspx:// (RTSPS sem SRTP e sem validar certificado), sem o "?enableSrtp".
  # ---------------------------------------------------------------------------
  unifi_blzcam01: rtspx://192.168.155.254:7441/TOKEN_LOW_CAM01
  unifi_blzcam01_hd: rtspx://192.168.155.254:7441/TOKEN_HIGH_CAM01
  unifi_blzcam02: rtspx://192.168.155.254:7441/TOKEN_LOW_CAM02
  unifi_blzcam02_hd: rtspx://192.168.155.254:7441/TOKEN_HIGH_CAM02
  unifi_blzcam03: rtspx://192.168.155.254:7441/TOKEN_LOW_CAM03
  unifi_blzcam03_hd: rtspx://192.168.155.254:7441/TOKEN_HIGH_CAM03
  unifi_blzcam04: rtspx://192.168.155.254:7441/TOKEN_LOW_CAM04
  unifi_blzcam04_hd: rtspx://192.168.155.254:7441/TOKEN_HIGH_CAM04

  # ---------------------------------------------------------------------------
  # Intelbras (condomínio)
  # Automático: ./pi/intelbras-streams.py --host 192.168.15.6 --user 'admin@greenforest' --password SENHA --apply
  # (gera um bloco entre "# >>> intelbras" e "# <<< intelbras" logo abaixo de "streams:").
  # Manual: DVR/NVR MHDX/NVD e câmeras VIP usam o padrão Dahua:
  #   rtsp://USUARIO:SENHA@IP:554/cam/realmonitor?channel=N&subtype=1   (subtype=1 = sub-stream)
  #   rtsp://USUARIO:SENHA@IP:554/cam/realmonitor?channel=N&subtype=0   (subtype=0 = stream principal)
  # Câmeras Mibo/iM (Wi-Fi) usam: rtsp://USUARIO:SENHA@IP:554/onvif1 (sub: /onvif2)
  # Usuário e senha com caracteres especiais precisam de codificação de URL (@ vira %40, # vira %23…).
  # A porta 37777 do app Intelbras é do protocolo proprietário; o RTSP usa a 554.
  # ---------------------------------------------------------------------------
  cond_canal_1: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=1&subtype=1
  cond_canal_1_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=1&subtype=0
  cond_canal_2: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=2&subtype=1
  cond_canal_2_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=2&subtype=0
  cond_canal_3: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=3&subtype=1
  cond_canal_3_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=3&subtype=0
  cond_canal_4: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=4&subtype=1
  cond_canal_4_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=4&subtype=0
  cond_canal_5: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=5&subtype=1
  cond_canal_5_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=5&subtype=0
  cond_canal_6: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=6&subtype=1
  cond_canal_6_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=6&subtype=0
  cond_canal_7: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=7&subtype=1
  cond_canal_7_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=7&subtype=0
  cond_canal_8: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=8&subtype=1
  cond_canal_8_hd: rtsp://admin%40greenforest:SENHA@192.168.15.6:554/cam/realmonitor?channel=8&subtype=0

  # ---------------------------------------------------------------------------
  # Câmeras já cadastradas no Home Assistant (opcional)
  # Se preferir puxar uma câmera via HA em vez de RTSP direto, use o token de acesso de longa duração:
  # ha_camera_x: http://homeassistant.local:8123/api/camera_proxy_stream/camera.NOME?token=TOKEN
  # ---------------------------------------------------------------------------
